# ========================================
# NGINX SERVER OPTIMIZATION FOR PERFORMANCE
# Performance Score Target: > 90
# ========================================

server {
    listen 443 ssl http2;
    server_name amadeya.org www.amadeya.org;
    
    # SSL Configuration
    ssl_certificate /path/to/certificate.crt;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    
    # ========================================
    # BROTLI COMPRESSION (Highest Priority)
    # ========================================
    
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-javascript image/svg+xml;
    
    # ========================================
    # GZIP FALLBACK
    # ========================================
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;
    
    # ========================================
    # LONG-TERM CACHING STRATEGY
    # ========================================
    
    # Root directory
    root /var/www/amadeya.org;
    index index.html;
    
    # Location blocks for different file types
    location ~* \.(webp|avif|jpg|jpeg|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
    
    # ========================================
    # SECURITY HEADERS
    # ========================================
    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy (optimized for performance)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://mc.yandex.ru https://www.google-analytics.com;" always;
    
    # ========================================
    # PERFORMANCE OPTIMIZATIONS
    # ========================================
    
    # Enable connection keep-alive
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # TCP optimizations
    tcp_nopush on;
    tcp_nodelay on;
    
    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_buffer_size 4k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    
    # Timeouts
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    
    # ========================================
    # HTTP/2 SERVER PUSH
    # ========================================
    
    http2_push_preload on;
    
    # Preload critical resources
    location = /css/style.css {
        http2_push /css/style.css;
    }
    
    location = /fonts/optimized-fonts.css {
        http2_push /fonts/optimized-fonts.css;
    }
    
    location = /img/5296603349773916432.webp {
        http2_push /img/5296603349773916432.webp;
    }
    
    # ========================================
    # STATIC FILE SERVING
    # ========================================
    
    location / {
        try_files $uri $uri/ /index.html;
        
        # Prevent access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # ========================================
    # API AND PROXY (if needed)
    # ========================================
    
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ========================================
    # ERROR PAGES
    # ========================================
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # ========================================
    # LOGS
    # ========================================
    
    access_log /var/log/nginx/amadeya.org.access.log combined;
    error_log /var/log/nginx/amadeya.org.error.log warn;
}

# ========================================
# HTTP TO HTTPS REDIRECT
# ========================================

server {
    listen 80;
    server_name amadeya.org www.amadeya.org;
    return 301 https://$server_name$request_uri;
}

# ========================================
# WWW REDIRECT
# ========================================

server {
    listen 443 ssl http2;
    server_name www.amadeya.org;
    return 301 https://amadeya.org$request_uri;
}
