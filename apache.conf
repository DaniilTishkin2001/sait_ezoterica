# ========================================
# APACHE SERVER OPTIMIZATION FOR PERFORMANCE
# Performance Score Target: > 90
# ========================================

<VirtualHost *:443>
    ServerName amadeya.org
    ServerAlias www.amadeya.org
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /path/to/certificate.crt
    SSLCertificateKeyFile /path/to/private.key
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS
    SSLHonorCipherOrder on
    SSLCompression off
    
    # ========================================
    # BROTLI COMPRESSION (Highest Priority)
    # ========================================
    
    # Enable Brotli compression
    <IfModule mod_brotli.c>
        BrotliCompressionQuality 6
        BrotliWindowSize 22
        BrotliBlockMode 0
        BrotliOn
        AddOutputFilterByType BROTLI_COMPRESS text/plain
        AddOutputFilterByType BROTLI_COMPRESS text/html
        AddOutputFilterByType BROTLI_COMPRESS text/css
        AddOutputFilterByType BROTLI_COMPRESS text/xml
        AddOutputFilterByType BROTLI_COMPRESS text/javascript
        AddOutputFilterByType BROTLI_COMPRESS application/javascript
        AddOutputFilterByType BROTLI_COMPRESS application/json
        AddOutputFilterByType BROTLI_COMPRESS application/xml
        AddOutputFilterByType BROTLI_COMPRESS image/svg+xml
    </IfModule>
    
    # ========================================
    # GZIP FALLBACK
    # ========================================
    
    <IfModule mod_deflate.c>
        # Set compression level
        DeflateCompressionLevel 6
        DeflateFilterNote Input "DEFLATED"
        
        # Compress these file types
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>
    
    # ========================================
    # LONG-TERM CACHING STRATEGY
    # ========================================
    
    <IfModule mod_expires.c>
        ExpiresActive On
        
        # Images - 1 year cache (immutable)
        <FilesMatch "\.(webp|avif|jpg|jpeg|png|gif|ico|svg)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "public, immutable"
            Header append Vary "Accept-Encoding"
        </FilesMatch>
        
        # Fonts - 1 year cache (immutable)
        <FilesMatch "\.(woff2?|eot|ttf|otf)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "public, immutable"
            Header append Vary "Accept-Encoding"
            Header append Access-Control-Allow-Origin "*"
        </FilesMatch>
        
        # CSS & JS - 1 year cache (immutable with hash)
        <FilesMatch "\.(css|js)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header append Cache-Control "public, immutable"
            Header append Vary "Accept-Encoding"
        </FilesMatch>
        
        # HTML - Short cache for dynamic content
        <FilesMatch "\.(html|htm)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 hour"
            Header append Cache-Control "public, must-revalidate"
        </FilesMatch>
    </IfModule>
    
    # ========================================
    # SECURITY HEADERS
    # ========================================
    
    <IfModule mod_headers.c>
        # HSTS
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        
        # Prevent MIME type sniffing
        Header always set X-Content-Type-Options "nosniff"
        
        # XSS Protection
        Header always set X-XSS-Protection "1; mode=block"
        
        # Content Security Policy (optimized for performance)
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://mc.yandex.ru https://www.google-analytics.com;"
        
        # Referrer Policy
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        
        # Permissions Policy
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        
        # Performance headers
        Header always set Connection "keep-alive"
        Header always set Keep-Alive "timeout=5, max=100"
    </IfModule>
    
    # ========================================
    # PERFORMANCE OPTIMIZATIONS
    # ========================================
    
    # Enable connection keep-alive
    KeepAlive On
    MaxKeepAliveRequests 100
    KeepAliveTimeout 5
    
    # MPM settings (for prefork)
    <IfModule mpm_prefork_module>
        StartServers 5
        MinSpareServers 5
        MaxSpareServers 10
        MaxRequestWorkers 20
        MaxConnectionsPerChild 30
    </IfModule>
    
    # MPM settings (for event)
    <IfModule mpm_event_module>
        StartServers 2
        MinSpareServers 2
        MaxSpareServers 5
        MaxRequestWorkers 20
        MaxConnectionsPerChild 30
    </IfModule>
    
    # ========================================
    # DOCUMENT ROOT
    # ========================================
    
    DocumentRoot "/var/www/amadeya.org"
    DirectoryIndex index.html
    
    # ========================================
    # DIRECTORY CONFIGURATION
    # ========================================
    
    <Directory "/var/www/amadeya.org">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        
        # Prevent access to hidden files
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
        
        # Prevent access to backup files
        <FilesMatch "\.(bak|backup|old|orig|save|tmp)$">
            Require all denied
        </FilesMatch>
    </Directory>
    
    # ========================================
    # ERROR PAGES
    # ========================================
    
    ErrorDocument 404 /404.html
    ErrorDocument 500 /500.html
    ErrorDocument 502 /502.html
    ErrorDocument 503 /503.html
    
    # ========================================
    # LOGS
    # ========================================
    
    ErrorLog ${APACHE_LOG_DIR}/amadeya.org-error.log
    CustomLog ${APACHE_LOG_DIR}/amadeya.org-access.log combined
</VirtualHost>

# ========================================
# HTTP TO HTTPS REDIRECT
# ========================================

<VirtualHost *:80>
    ServerName amadeya.org
    ServerAlias www.amadeya.org
    
    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    # Remove www
    RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
    RewriteRule ^(.*)$ https://%1/$1 [L,R=301]
</VirtualHost>

# ========================================
# WWW TO NON-WWW REDIRECT
# ========================================

<VirtualHost *:443>
    ServerName www.amadeya.org
    
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
    RewriteRule ^(.*)$ https://%1/$1 [L,R=301]
    
    # SSL settings (same as main)
    SSLEngine on
    SSLCertificateFile /path/to/certificate.crt
    SSLCertificateKeyFile /path/to/private.key
</VirtualHost>
